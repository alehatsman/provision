---
description: build the release binary for this machine

# D1: one static binary per target, built natively on the machine that will
# run it. The one exception is Windows, which has no toolchain of its own in
# this fleet and is cross-compiled from Linux (D1 amendment).

steps:
  - name: cargo build --release
    shell: cargo build --release
    # Spec §6.1: this step's exit code is its whole contract -- there is no
    # state to inspect and nothing for provision to be unsure about -- so it
    # says so. A verb cannot make that declaration on a file's behalf (D17,
    # phase 5b), which is why it is written here.
    changed_when: "false"
    timeout: 20m
