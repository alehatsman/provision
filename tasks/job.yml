---
description: the whole gate as one job, for a runner to execute in one process

# The shape D19 and D24 ask for: a runner writes no per-step entry point, it
# runs `provision apply tasks/job.yml --json --deadline <N>m` once and reads
# every step's status, exit code, output and `file:line` off stdout.
#
# Two `use:` lines rather than a third copy of what they do. `tools.yml` owns
# the rust-quality pin and `ci.yml` owns the gate; a CI job that restated
# either would be the second place to look when one of them changes, and the
# one that goes stale.
steps:
  - name: tools
    use: ./tools.yml

  - name: gate
    use: ./ci.yml
