---
description: copy the release binary onto PATH

# Deliberately not `cargo install`: that rebuilds into its own target dir and
# would double the build time for a binary the build task has already
# produced.

props:
  dest:
    type: string
    default: "~/.local/bin/provision"
    description: Where the binary lands. `~` expands.

steps:
  - name: cargo build --release
    shell: cargo build --release
    timeout: 20m

  - name: Ensure the destination directory exists
    file:
      path: "{{ props.dest | dirname }}"
      state: dir

  # `../`: a `file` step's `src` resolves against the file that names it
  # (spec §4), which is this one, in `tasks/`. Only a step's default *cwd*
  # follows the invocation directory under `run` — and that is why this is a
  # `file` step rather than the justfile's `cp`: it reports `ok` when the
  # binary on PATH already matches, which `cp` cannot.
  - name: Copy the binary into place
    file:
      path: "{{ props.dest }}"
      src: ../target/release/provision
      state: file
      mode: "0755"
