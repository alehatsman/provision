---
description: copy the release binary onto PATH

# Deliberately not `cargo install`: that rebuilds into its own target dir and
# would double the build time for a binary the build task has already
# produced.

props:
  dest:
    type: string
    default: "~/.local/bin/provision"
    description: Where the binary lands. `~` expands.

steps:
  # `use`, not a second copy of `build.yml`'s step. It was a copy -- the same
  # shell, the same `changed_when`, the same `timeout` and the same four-line
  # comment -- and plan.md's deferred table watches for exactly that: three
  # copies of one step is the threshold that reopens the loop question. This
  # is the answer that does not need loops, because it already exists. A
  # component with no props is a task's dependency spelled with the one
  # mechanism provision has for reusing a step list (D17).
  - name: build
    use: ./build.yml

  - name: Ensure the destination directory exists
    file:
      path: "{{ props.dest | dirname }}"
      state: dir

  # `../`: a `file` step's `src` resolves against the file that names it
  # (spec §3), which is this one, in `tasks/`. Only a step's default *cwd*
  # follows the invocation directory (spec §4) — and that is why this is a
  # `file` step rather than the justfile's `cp`: it reports `ok` when the
  # binary on PATH already matches, which `cp` cannot.
  - name: Copy the binary into place
    file:
      path: "{{ props.dest }}"
      src: ../target/release/provision
      state: file
      mode: "0755"
