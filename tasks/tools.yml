---
description: check out rust-quality and install the three tools its gate runs

steps:
  # The pin lives here and nowhere else in this repo. Bump it in one place.
  #
  # `vars`, not a prop default: a prop's default is taken as written, never
  # rendered (spec §3.2), so `{{ home }}` in one would stay four braces.
  #
  # `rq_ref` is a ref of any kind. A tag is the steady state and a branch is
  # what a change to rust-quality looks like while it is in flight; the `git`
  # action tells the two apart by asking the repository, so moving between
  # them is this one line and nothing else. Both paths were driven against
  # this checkout before the pin came back to the tag.
  - vars:
      rq_ref: v0.5.0
      rq_dir: "{{ home }}/.cache/provision/tools/rust-quality"

  # This step used to be sixty lines of shell: a `creates`-gated clone, then a
  # pin step whose `unless` had to tell a tag from a branch, peel an annotated
  # tag with `^{commit}`, and short-circuit before the fetch so an offline
  # machine still converged. All of that is the `git` action's job now
  # (spec §6.8), and it is the reason the action exists — the block got the
  # annotated-tag peel wrong once, and a bug in one place is better than the
  # same bug copied into teleport's copy of it.
  - name: "rust-quality at {{ rq_ref }}"
    git:
      repo: https://github.com/alehatsman/rust-quality.git
      dest: "{{ rq_dir }}"
      ref: "{{ rq_ref }}"

  # rq/tools. Installs cargo-nextest, cargo-deny and cargo-machete and adds the
  # clippy and rustfmt rustup components, then verifies. From source unless
  # cargo-binstall is present, so the first run is slow and says so.
  #
  # Not a `use:` of the preset: the preset's install step is ungated by design
  # -- it changes real state and cannot say in advance whether it will -- and
  # the `creates` gate below is this repo's own answer to "an interrupted
  # install should be retried, not skipped". A `use` site cannot reach inside
  # to add it, so the two steps stay here and the preset stays honest.
  - name: Install the gate's tools
    shell: bash "{{ rq_dir }}/scripts/tools.sh" install
    creates: "{{ home }}/.cargo/bin/cargo-machete"
    timeout: 30m

  # A check, so its exit code is its whole contract and it needs no modifier
  # to say so (spec §6.1, D20).
  - name: Verify the gate's tools
    shell: bash "{{ rq_dir }}/scripts/tools.sh" check
