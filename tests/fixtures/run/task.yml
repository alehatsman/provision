---
description: a task with one required prop and one defaulted
props:
  target:
    type: string
    required: true
  label:
    type: string
    default: "dev"
  count:
    type: int
    default: 1
steps:
  - name: Echo the props
    shell: echo "{{ props.target }} {{ props.label }} {{ props.count }}"

  - name: A gated step
    shell: echo gated
    changed_when: "false"
