---
# Three action bodies that only a parse can reject. Each was accepted by
# `validate` and refused by `plan` until validate began parsing bodies too.
- name: A pkg that names no package
  pkg:
    manager: apt
    update_cache: true

- name: A file with neither content nor src
  file:
    path: /tmp/provision-never-written
    state: file

- name: A service that declares nothing
  service:
    name: nothing.service

# A string answers "can I iterate" with its characters, so this parsed as the
# argv `e c h o …` and failed at run time as `cannot run e`.
- name: A cmd given a script instead of a list
  cmd: "echo hi"

# A quoted "true" is a string. These were read as `false` without a word,
# so the cask was installed as a formula and the shell was not a login one.
- name: A pkg whose cask flag is a string
  pkg:
    name: firefox
    manager: brew
    cask: "true"

- name: A shell whose login flag is a string
  shell:
    script: echo hi
    login: "true"
  changed_when: "false"

# The same for `file`: `force: "true"` read as false, so a step meant to
# replace what is at `path` refused to.
- name: A file whose force flag is a string
  file:
    path: /tmp/provision-never-written
    content: x
    force: "true"

# Fields that belong to another state were accepted and did nothing, which is
# how a plan grows a line that means nothing for a year (spec §6.3).
- name: A link given content
  file:
    path: /tmp/provision-never-written
    state: link
    src: /tmp/elsewhere
    content: x

- name: A directory given a src
  file:
    path: /tmp/provision-never-written-dir
    state: dir
    src: /tmp/elsewhere
