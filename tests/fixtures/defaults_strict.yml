# One `defaults` step that says where it runs and one that does not.
- name: guarded
  defaults:
    domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: true
  when: os == "darwin"
- name: unguarded
  defaults:
    domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: true
# A variable whose name contains "os" is not the `os` fact. A substring
# match took this `when` for a guard.
- vars:
    hostos: darwin
- name: guarded by a lookalike
  defaults:
    domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: true
  when: hostos == "darwin"
