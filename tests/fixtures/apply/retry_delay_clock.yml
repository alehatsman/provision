# A retry's `delay` is part of the step, so the run's clock and a stop signal
# reach into it (spec §8, §10).
#
# The delay is far longer than any test waits: a run that sleeps it out in
# full instead of noticing `--deadline` or a TERM is the bug, and wall time is
# how the test tells. The failing attempt writes to stderr and exits 5, so the
# step's result can be checked for the attempt that actually ran — not a
# stand-in invented for the stop.
- name: Fails and waits to retry
  shell: echo boom >&2; exit 5
  retry:
    attempts: 3
    delay: 30s
  changed_when: "false"

- name: Must not run after the stop
  shell: "true"
  changed_when: "false"
