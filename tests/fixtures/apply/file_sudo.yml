---
# Writes into a directory the invoking user cannot write, which is the case
# the temp-file staging rule exists for.
- name: A root-owned config file
  file:
    path: "{{ env.PROVISION_ROOT_DIR }}/provision.conf"
    state: file
    content: "owned by root\n"
    mode: "0440"
    owner: root
    # By name, because naming a group is the `install -g` path worth covering
    # — but root's group is `root` on Linux and `wheel` on macOS, so the test
    # supplies whichever this machine has.
    group: "{{ env.PROVISION_ROOT_GROUP }}"
  sudo: true
