# A plain plan file, entered with `import:` — it shares the caller's scope,
# so `ssh_key_path` comes from the machine's vars and the key it registers
# is visible to the steps after the import.

- name: SSH config dir
  file:
    path: ~/.ssh
    state: dir
    mode: "0700"
  tags: [ssh]

- name: Generate SSH identity
  # `| expanduser` because spec §3 leaves `~` alone inside a shell script —
  # the shell is supposed to do it, and inside double quotes the shell does
  # not. `creates:` below is a path field the tool owns, so it *is* expanded:
  # without the filter the gate would watch the real path while ssh-keygen
  # wrote to a directory literally named `~`, and the step would run forever
  # without ever satisfying its own gate.
  shell: ssh-keygen -t ed25519 -C "{{ email }}" -f "{{ ssh_key_path | expanduser }}" -N ""
  creates: "{{ ssh_key_path }}"
  tags: [ssh]

- name: Identity is readable only by its owner
  assert:
    command: 'test "$(stat -c %a "{{ ssh_key_path | expanduser }}")" = "600"'
    msg: "{{ ssh_key_path }} has the wrong mode"
  when: os == "linux"
  tags: [ssh, verify]
