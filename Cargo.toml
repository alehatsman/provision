[package]
name = "provision"
version = "0.1.0"
edition = "2024"
autoexamples = false   # examples/ holds YAML plans, not Rust examples

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", features = ["derive"] }
gethostname = "1.1.0"
home = "0.5.12"
minijinja = { version = "2.24.0", features = ["loader", "json"] }
saphyr = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
which = "8.0.6"
