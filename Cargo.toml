[package]
name = "provision"
version = "0.9.0"
edition = "2024"
autoexamples = false   # examples/ holds YAML plans, not Rust examples

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", features = ["derive"] }
gethostname = "1.1.0"
home = "0.5.12"
minijinja = { version = "2.24.0", features = ["loader", "json"] }
saphyr = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2"
tempfile = "3"
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
# Only for what std does not expose: killing a process *group*, and reading a
# sudo password without echo. `Command::process_group` is std; the kill is not.
libc = "0.2"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }


